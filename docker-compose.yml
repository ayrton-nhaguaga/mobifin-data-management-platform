services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mobifin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup.ps1 primeiro}
      POSTGRES_DB: mobifin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobifin -d mobifin"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mobifin:${POSTGRES_PASSWORD}@db:5432/mobifin
      JWT_SECRET: ${JWT_SECRET:?Execute scripts/setup.ps1 primeiro}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Execute scripts/setup.ps1 primeiro}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      REPORT_DEADLINE_DAYS: ${REPORT_DEADLINE_DAYS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
